[project]
name = "ids-mcp"
version = "0.1.0"
description = "IDS OT/IT MCP Server (Read-Only)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
